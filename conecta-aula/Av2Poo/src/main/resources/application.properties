spring.application.name=conecta-aula
server.port=8080

# ---------- JSP ----------
# O controller retorna "index" e o Spring abre /WEB-INF/index.jsp
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp
# Usa a nossa página error.jsp no lugar da página branca padrão do Spring
server.error.whitelabel.enabled=false

# ---------- Banco de dados H2 ----------
# O banco fica salvo na pasta "dados" do projeto, então nada se perde ao reiniciar
spring.datasource.url=jdbc:h2:file:./dados/conecta-aula
spring.datasource.username=sa
spring.datasource.password=
# Cria/atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
# Mostra o SQL no console (bom para estudar, pode desligar depois)
spring.jpa.show-sql=false
# Console para ver as tabelas: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./dados/conecta-aula)
spring.h2.console.enabled=true
